name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-validation:
    name: Validate repository content
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate shell script syntax
        run: bash -n scripts/doctor.sh scripts/cleanup.sh scripts/check-curriculum.sh

      - name: Validate curriculum structure
        run: bash scripts/check-curriculum.sh

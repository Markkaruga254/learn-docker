name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-validation:
    name: Validate repository content
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate shell script syntax
        run: >-
          bash -n scripts/doctor.sh scripts/cleanup.sh
          scripts/check-curriculum.sh
          modules/10-capstones/tier3-secure-pipeline/reference/deploy.sh

      - name: Validate curriculum structure
        run: bash scripts/check-curriculum.sh

      - name: Confirm Docker Compose is available
        run: docker compose version

      - name: Validate API, database, and proxy capstone
        working-directory: modules/10-capstones/tier2-api-db-proxy/reference
        run: |
          printf 'POSTGRES_DB=ci_test\nPOSTGRES_USER=ci_test\nPOSTGRES_PASSWORD=ci_test\n' > .env
          docker compose -f docker-compose.yml config -q
          rm -f .env

      - name: Validate hardened production Compose configuration
        working-directory: modules/10-capstones/tier3-secure-pipeline/reference
        env:
          IMAGE_TAG: ci-validation
        run: |
          printf 'POSTGRES_DB=ci_test\nPOSTGRES_USER=ci_test\nPOSTGRES_PASSWORD=ci_test\n' > .env
          docker compose -f docker-compose.prod.yml config -q
          rm -f .env

# Deploy with: IMAGE_TAG=git-abc1234 docker compose -f docker-compose.prod.yml up -d
services:
  api:
    image: ghcr.io/YOUR_GH_USER/YOUR_REPO/api:${IMAGE_TAG:?set IMAGE_TAG}
    env_file: .env
    environment:
      DB_HOST: db
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    networks: [backend, frontend]

  db:
    image: postgres:16
    env_file: .env
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [backend]

  proxy:
    image: nginx:1.27-alpine
    ports: ["80:80"]
    volumes: ["./nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [api]
    restart: unless-stopped
    networks: [frontend]

volumes:
  pgdata:
networks:
  frontend:
  backend:
